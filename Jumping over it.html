<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumping Cube</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: white;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 800;
        canvas.height = 400;

        class Cube {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = 50;
                this.y = canvas.height - this.height - 10;
                this.velocityY = 0;
                this.gravity = 0.5;
                this.jumpStrength = -10;
            }
            draw() {
                ctx.fillStyle = "blue";
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            update() {
                this.y += this.velocityY;
                this.velocityY += this.gravity;
                if (this.y + this.height >= canvas.height - 10) {
                    this.y = canvas.height - this.height - 10;
                    this.velocityY = 0;
                }
            }
            jump() {
                if (this.y === canvas.height - this.height - 10) {
                    this.velocityY = this.jumpStrength;
                }
            }
        }

        class Obstacle {
            constructor() {
                this.width = 20;
                this.height = 30;
                this.x = canvas.width;
                this.y = canvas.height - this.height - 10;
                this.speed = 3;
            }
            draw() {
                ctx.fillStyle = "red";
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            update() {
                this.x -= this.speed;
            }
        }

        let cube = new Cube();
        let obstacles = [];
        let gameOver = false;

        function updateGame() {
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            cube.update();
            cube.draw();
            
            if (Math.random() < 0.02) {
                obstacles.push(new Obstacle());
            }
            
            obstacles.forEach((obstacle, index) => {
                obstacle.update();
                obstacle.draw();
                
                if (
                    cube.x < obstacle.x + obstacle.width &&
                    cube.x + cube.width > obstacle.x &&
                    cube.y < obstacle.y + obstacle.height &&
                    cube.y + cube.height > obstacle.y
                ) {
                    gameOver = true;
                    alert("Game Over! Reload to play again.");
                }
            });
            requestAnimationFrame(updateGame);
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === " ") cube.jump();
        });

        updateGame();
    </script>
</body>
</html>
